services:
  mariadb:
    image: mariadb:11
    container_name: store-backend-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: storebackend
      MARIADB_USER: storeuser
      MARIADB_PASSWORD: storepassword
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
